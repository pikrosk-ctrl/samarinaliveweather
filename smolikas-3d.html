<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Δορυφορική Ροή & 12h Πρόγνωση — Σμόλικας / Σαμαρίνα</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #060a12;
            color: #f1f5f9;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Top HUD */
        .hud-top {
            position: fixed;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(56, 189, 248, 0.35);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 10px;
            text-align: center;
            z-index: 20;
            box-shadow: 0 8px 25px rgba(0,0,0,0.65);
            max-width: 96vw;
            width: 96vw;
        }
        .hud-top h1 { font-size: 0.82rem; color: #e0f2fe; }
        .hud-top p { display: none; } /* Κρύβεται σε κινητό για οικονομία χώρου */
        .badges-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px;
            margin-top: 4px;
        }
        .live-pill, .dem-pill, .time-pill {
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.64rem;
            font-weight: 700;
        }
        .live-pill { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.45); color: #34d399; display: flex; align-items: center; gap: 4px; }
        .dem-pill { background: rgba(56, 189, 248, 0.14); border: 1px solid rgba(56, 189, 248, 0.4); color: #7dd3fc; }
        .time-pill { background: rgba(251, 191, 36, 0.14); border: 1px solid rgba(251, 191, 36, 0.45); color: #fde68a; cursor: pointer; }
        .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; box-shadow: 0 0 6px #10b981; }

        /* Timeline Box */
        .timeline-box {
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px solid rgba(51, 65, 85, 0.75);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .source-tabs { display: flex; justify-content: center; gap: 4px; }
        .src-btn {
            background: #0f172a;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.62rem;
            font-weight: 700;
            cursor: pointer;
        }
        .src-btn.active-live { background: rgba(16, 185, 129, 0.22); color: #34d399; border-color: #10b981; }
        .src-btn.active-station { background: rgba(52, 211, 153, 0.2); color: #6ee7b7; border-color: #34d399; }
        .src-btn.active-hybrid { background: rgba(56, 189, 248, 0.22); color: #7dd3fc; border-color: #38bdf8; }
        .timeline-controls { display: flex; align-items: center; gap: 6px; justify-content: center; }
        .play-btn { background: #0284c7; color: #fff; border: none; padding: 2px 8px; border-radius: 4px; font-size: 0.64rem; font-weight: 700; cursor: pointer; }
        #sl-forecast-hr { width: 130px; accent-color: #38bdf8; height: 3px; }
        .fc-step-badge { font-size: 0.64rem; font-weight: 700; color: #e0f2fe; background: #0f172a; border: 1px solid #334155; padding: 1px 6px; border-radius: 4px; }

        /* Collapsible Floating Panels για Κινητά */
        .floating-panel {
            position: fixed;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            backdrop-filter: blur(8px);
            border-radius: 10px;
            z-index: 20;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            transition: max-height 0.3s ease;
        }

        /* Stats Panel (Πάνω Δεξιά - μικρότερο) */
        .hud-stats {
            top: 108px;
            right: 8px;
            width: 165px;
            padding: 6px 8px;
            font-size: 0.65rem;
        }
        .stat-row { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px solid rgba(51, 65, 85, 0.3); }
        .stat-row:last-child { border-bottom: none; }
        .stat-k { color: #94a3b8; }
        .stat-v { font-weight: 700; color: #38bdf8; }
        .stat-v.snow { color: #bae6fd; }

        /* Controls Panel (Κάτω Αριστερά - Toggleable) */
        .hud-controls {
            bottom: 8px;
            left: 8px;
            width: 210px;
            padding: 8px;
            max-height: 38px;
            overflow: hidden;
        }
        .hud-controls.expanded { max-height: 280px; }
        .ctrl-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            font-weight: 700;
            color: #e2e8f0;
            cursor: pointer;
        }
        .ctrl-body {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .slider-group { margin-bottom: 2px; }
        .slider-label { display: flex; justify-content: space-between; font-size: 0.62rem; color: #cbd5e1; }
        .slider-label span:last-child { color: #38bdf8; font-weight: 700; }
        input[type="range"] { width: 100%; accent-color: #38bdf8; height: 3px; }
        .preset-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 4px; }
        .preset-btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 3px 2px; border-radius: 4px; font-size: 0.58rem; font-weight: 600; text-align: center; cursor: pointer; }

        /* Απόκρυψη θορύβου σε κινητό */
        .hud-legend { display: none; }

        .marker-label {
            position: fixed;
            transform: translate(-50%, -100%);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.45);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.62rem;
            pointer-events: none;
            white-space: nowrap;
            z-index: 10;
        }
        .marker-label b { color: #f8fafc; display: block; }
        .marker-label span { color: #38bdf8; font-size: 0.58rem; }
        .marker-label.samarina { border-color: #10b981; }
        .marker-label.samarina span { color: #34d399; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="hud-top">
        <h1>3D Σμόλικας & Σαμαρίνα</h1>
        <div class="badges-row">
            <div class="live-pill"><span class="live-dot"></span><span id="live-status-text">ISAMAR38</span></div>
            <div class="dem-pill" id="dem-status-text">🛰️ DEM</div>
            <button class="time-pill" id="time-mode-btn" onclick="cycleTimeMode()">☀️ Auto</button>
        </div>

        <div class="timeline-box">
            <div class="source-tabs">
                <button class="src-btn active-live" id="btn-src-live" onclick="setDataSource('live')">🟢 Live</button>
                <button class="src-btn" id="btn-src-station" onclick="setDataSource('station')">📡 Σταθμός</button>
                <button class="src-btn" id="btn-src-hybrid" onclick="setDataSource('hybrid')">❄️ Υβριδικό</button>
            </div>
            <div class="timeline-controls" id="timeline-controls" style="display:none;">
                <button class="play-btn" id="btn-play-fc" onclick="toggleForecastPlay()">▶ Play</button>
                <input type="range" id="sl-forecast-hr" min="0" max="12" step="1" value="0">
                <span class="fc-step-badge" id="lbl-fc-step">+0h</span>
            </div>
        </div>
    </div>

    <div class="floating-panel hud-stats">
        <div class="stat-row"><span class="stat-k">Θερμ (1.450μ):</span><span class="stat-v" id="val-temp">-- °C</span></div>
        <div class="stat-row"><span class="stat-k">Υγρό Θερμ:</span><span class="stat-v" id="val-wb">-- °C</span></div>
        <div class="stat-row"><span class="stat-k">Άνεμος:</span><span class="stat-v" id="val-wind">-- km/h</span></div>
        <div class="stat-row"><span class="stat-k">Χιόνι:</span><span class="stat-v snow" id="val-snowline">-- μ.</span></div>
    </div>

    <div class="floating-panel hud-controls" id="controls-panel">
        <div class="ctrl-header" onclick="toggleControlsPanel()">
            <span id="ctrl-toggle-title">⚙️ Παράμετροι (Άνοιγμα)</span>
            <span>▼</span>
        </div>
        <div class="ctrl-body">
            <div class="slider-group">
                <div class="slider-label"><span>Θερμοκρασία (°C)</span><span id="lbl-temp">8.0°C</span></div>
                <input type="range" id="sl-temp" min="-15" max="25" step="0.5" value="8">
            </div>
            <div class="slider-group">
                <div class="slider-label"><span>Σημείο Δρόσου (°C)</span><span id="lbl-dew">6.0°C</span></div>
                <input type="range" id="sl-dew" min="-18" max="20" step="0.5" value="6">
            </div>
            <div class="slider-group">
                <div class="slider-label"><span>Άνεμος (km/h)</span><span id="lbl-wind">12 km/h</span></div>
                <input type="range" id="sl-wind" min="0" max="90" step="1" value="12">
            </div>
            <div class="slider-group">
                <div class="slider-label"><span>Διεύθυνση (°)</span><span id="lbl-dir">240°</span></div>
                <input type="range" id="sl-dir" min="0" max="360" step="5" value="240">
            </div>
            <div class="slider-group">
                <div class="slider-label"><span>Υετός (mm/h)</span><span id="lbl-rain">0.0 mm/h</span></div>
                <input type="range" id="sl-rain" min="0" max="15" step="0.5" value="0">
            </div>
            <div class="preset-row">
                <button class="preset-btn" onclick="applyPreset('snow')">❄️ Χιονιάς</button>
                <button class="preset-btn" onclick="applyPreset('blizzard')">🌬️ Θύελλα</button>
                <button class="preset-btn" onclick="applyPreset('fog')">🌫️ Ομίχλη</button>
            </div>
        </div>
    </div>

    <div id="lbl-peak" class="marker-label"><b>▲ Κορυφή</b><span>2.637μ</span></div>
    <div id="lbl-saddle" class="marker-label"><b>▲ Διάσελο</b><span>~2.150μ</span></div>
    <div id="lbl-samarina" class="marker-label samarina"><b>🏠 Σαμαρίνα</b><span>1.450μ</span></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js"></script>

    <script>
        function toggleControlsPanel() {
            const p = document.getElementById('controls-panel');
            p.classList.toggle('expanded');
            const isExp = p.classList.contains('expanded');
            document.getElementById('ctrl-toggle-title').innerText = isExp ? '⚙️ Παράμετροι (Κλείσιμο)' : '⚙️ Παράμετροι (Άνοιγμα)';
        }

        const WU_STATION_ID = "ISAMAR38";
        const WU_API_KEY = "5c94ee0c13f240ec94ee0c13f2b0ecd9";

        const GEO_BOUNDS = { latMin: 40.068, latMax: 40.132, lonMin: 20.914, lonMax: 21.058 };
        const TERRAIN_SIZE = 74;
        const SEGMENTS = 160; // Ελαφρύτερο για κινητά
        const DEM_GRID_N = 24;
        const DEM_CACHE_KEY = "smolikas_real_dem_24x24_v5";

        let realDemGrid = null;
        let forecastPacket = null;
        let currentDataSource = 'live';
        let forecastPlayTimer = null;
        let forecastOverrideDecHour = null;

        function latLonToSceneXZ(lat, lon) {
            const u = (lon - GEO_BOUNDS.lonMin) / (GEO_BOUNDS.lonMax - GEO_BOUNDS.lonMin);
            const v = (lat - GEO_BOUNDS.latMin) / (GEO_BOUNDS.latMax - GEO_BOUNDS.latMin);
            return { x: (u - 0.5) * TERRAIN_SIZE, z: (0.5 - v) * TERRAIN_SIZE };
        }

        function sampleRealDem(x, z) {
            const u = Math.max(0, Math.min(1, (x / TERRAIN_SIZE) + 0.5));
            const v = Math.max(0, Math.min(1, 0.5 - (z / TERRAIN_SIZE)));
            const fx = u * (DEM_GRID_N - 1), fz = v * (DEM_GRID_N - 1);
            const ix = Math.min(DEM_GRID_N - 2, Math.floor(fx)), iz = Math.min(DEM_GRID_N - 2, Math.floor(fz));
            const tx = fx - ix, tz = fz - iz;
            const e00 = realDemGrid[iz * DEM_GRID_N + ix], e10 = realDemGrid[iz * DEM_GRID_N + (ix + 1)];
            const e01 = realDemGrid[(iz + 1) * DEM_GRID_N + ix], e11 = realDemGrid[(iz + 1) * DEM_GRID_N + (ix + 1)];
            return (e00 + (e10 - e00) * tx) * (1 - tz) + (e01 + (e11 - e01) * tx) * tz;
        }

        function fallbackElevation(x, z) {
            return 1450 + 400 * Math.exp(-Math.pow(x/25, 2));
        }

        function getElevationMeters(x, z) {
            if (realDemGrid) {
                return sampleRealDem(x, z) + ((Math.sin(x*0.5)*Math.cos(z*0.5))*8);
            }
            return fallbackElevation(x, z);
        }

        function elevToSceneY(elevMeters) { return ((elevMeters - 1150) / 1487) * 29.0; }

        async function loadRealSmolikasDEM() {
            try {
                const cached = localStorage.getItem(DEM_CACHE_KEY);
                if (cached) {
                    realDemGrid = new Float32Array(JSON.parse(cached));
                    rebuildTerrainGeometry();
                    return;
                }
            } catch (e) {}
            try {
                const lats = [], lons = [];
                for (let iz = 0; iz < DEM_GRID_N; iz++) {
                    let lat = GEO_BOUNDS.latMin + (iz / (DEM_GRID_N - 1)) * (GEO_BOUNDS.latMax - GEO_BOUNDS.latMin);
                    for (let ix = 0; ix < DEM_GRID_N; ix++) {
                        let lon = GEO_BOUNDS.lonMin + (ix / (DEM_GRID_N - 1)) * (GEO_BOUNDS.lonMax - GEO_BOUNDS.lonMin);
                        lats.push(lat.toFixed(4)); lons.push(lon.toFixed(4));
                    }
                }
                const res = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lats.slice(0,40).join(',')}&longitude=${lons.slice(0,40).join(',')}`);
                const resp = await res.json();
                if (resp && Array.isArray(resp.elevation)) {
                    realDemGrid = new Float32Array(576).fill(1500);
                    resp.elevation.forEach((el, idx) => { realDemGrid[idx] = el; });
                    rebuildTerrainGeometry();
                }
            } catch (err) {}
        }

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x070d19);
        scene.fog = new THREE.FogExp2(0x091120, 0.0085);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 400);
        camera.position.set(28, 20, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.maxPolarAngle = Math.PI * 0.47;
        controls.minDistance = 10;
        controls.maxDistance = 85;
        controls.target.set(0, 8.0, 0);

        const hemiLight = new THREE.HemisphereLight(0x93c5fd, 0x1e293b, 0.7);
        scene.add(hemiLight);
        const sunLight = new THREE.DirectionalLight(0xfff7ed, 1.3);
        sunLight.position.set(30, 45, 25);
        scene.add(sunLight);

        const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, SEGMENTS, SEGMENTS);
        terrainGeo.rotateX(-Math.PI / 2);
        const posAttr = terrainGeo.attributes.position;
        const colors = new Float32Array(posAttr.count * 3);
        const terrainMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, metalness: 0.05 });
        const terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
        scene.add(terrainMesh);

        const coordsPeak = latLonToSceneXZ(40.0908, 20.9261);
        const coordsSaddle = latLonToSceneXZ(40.0975, 20.9685);
        const coordsSamarina = latLonToSceneXZ(40.1050, 21.0180);

        function createPin(x, z, colorHex) {
            const group = new THREE.Group();
            const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,2.5,0)]);
            group.add(new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: colorHex })));
            group.add(new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), new THREE.MeshBasicMaterial({ color: colorHex })));
            scene.add(group);
            return { group, x, y: 10, z };
        }

        const pinPeak = createPin(coordsPeak.x, coordsPeak.z, 0x38bdf8);
        const pinSaddle = createPin(coordsSaddle.x, coordsSaddle.z, 0xf59e0b);
        const pinSamarina = createPin(coordsSamarina.x, coordsSamarina.z, 0x10b981);

        function updatePinHeights() {
            [pinPeak, pinSaddle, pinSamarina].forEach(p => {
                p.group.position.set(p.x, elevToSceneY(getElevationMeters(p.x, p.z)), p.z);
                p.y = p.group.position.y + 2.5;
            });
        }

        function rebuildTerrainGeometry() {
            for (let i = 0; i < posAttr.count; i++) {
                const x = posAttr.getX(i), z = posAttr.getZ(i);
                const elev = getElevationMeters(x, z);
                posAttr.setY(i, elevToSceneY(elev));
                const c = elev > 2100 ? 0xd1d5db : (elev > 1700 ? 0x4b5335 : 0x163326);
                colors[i*3] = ((c>>16)&255)/255; colors[i*3+1] = ((c>>8)&255)/255; colors[i*3+2] = (c&255)/255;
            }
            posAttr.needsUpdate = true;
            terrainGeo.computeVertexNormals();
            terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            updatePinHeights();
        }

        let state = { temp: 8.0, dew: 6.0, wind: 12, dir: 240, rain: 0.0, wetBulb: 6.7, snowlineMeters: 2400 };

        function calcWetBulb(temp, hum) {
            const h = Math.max(1, Math.min(100, hum));
            return temp * Math.atan(0.151977 * Math.sqrt(h + 8.313659)) + Math.atan(temp + h) - Math.atan(h - 1.676331) + 0.00391838 * Math.pow(h, 1.5) * Math.atan(0.023101 * h) - 4.686035;
        }

        function recalcPhysics() {
            const temp = parseFloat(document.getElementById('sl-temp').value);
            const dew = parseFloat(document.getElementById('sl-dew').value);
            const wind = parseFloat(document.getElementById('sl-wind').value);
            const dir = parseFloat(document.getElementById('sl-dir').value);
            const rain = parseFloat(document.getElementById('sl-rain').value);

            const rh = Math.min(100, Math.max(10, (Math.exp((17.67*dew)/(dew+243.5)) / Math.exp((17.67*temp)/(temp+243.5))) * 100));
            const wb = calcWetBulb(temp, rh);
            const snowline = Math.round(1450 + ((wb - 0.5) / 6.5) * 1000);

            document.getElementById('lbl-temp').innerText = `${temp.toFixed(1)}°C`;
            document.getElementById('lbl-dew').innerText = `${dew.toFixed(1)}°C`;
            document.getElementById('lbl-wind').innerText = `${wind} km/h`;
            document.getElementById('lbl-dir').innerText = `${dir}°`;
            document.getElementById('lbl-rain').innerText = `${rain.toFixed(1)} mm/h`;

            document.getElementById('val-temp').innerText = `${temp.toFixed(1)}°C`;
            document.getElementById('val-wb').innerText = `${wb.toFixed(1)}°C`;
            document.getElementById('val-wind').innerText = `${wind} km/h`;
            document.getElementById('val-snowline').innerText = snowline <= 1450 ? `Χιόνι στο χωριό` : `${snowline} μ.`;
        }

        ['sl-temp', 'sl-dew', 'sl-wind', 'sl-dir', 'sl-rain'].forEach(id => {
            document.getElementById(id).addEventListener('input', recalcPhysics);
        });

        function applyPreset(type) {
            if (type === 'snow') {
                document.getElementById('sl-temp').value = -1.5; document.getElementById('sl-dew').value = -2.0; document.getElementById('sl-wind').value = 34; document.getElementById('sl-rain').value = 4.5;
            } else if (type === 'blizzard') {
                document.getElementById('sl-temp').value = -6.0; document.getElementById('sl-dew').value = -7.5; document.getElementById('sl-wind').value = 68; document.getElementById('sl-rain').value = 6.0;
            } else if (type === 'fog') {
                document.getElementById('sl-temp').value = 2.5; document.getElementById('sl-dew').value = 2.3; document.getElementById('sl-wind').value = 6; document.getElementById('sl-rain').value = 0.0;
            }
            recalcPhysics();
        }

        function updateLabels() {
            [ {el: document.getElementById('lbl-peak'), pos: pinPeak}, {el: document.getElementById('lbl-saddle'), pos: pinSaddle}, {el: document.getElementById('lbl-samarina'), pos: pinSamarina} ].forEach(item => {
                const v = new THREE.Vector3(item.pos.x, item.pos.y, item.pos.z).project(camera);
                if (v.z > 1) { item.el.style.display = 'none'; } else {
                    item.el.style.display = 'block';
                    item.el.style.left = `${(v.x * 0.5 + 0.5) * window.innerWidth}px`;
                    item.el.style.top = `${(-(v.y * 0.5) + 0.5) * window.innerHeight}px`;
                }
            });
        }

        async function syncLiveWeather() {
            try {
                const res = await fetch(`https://api.weather.com/v2/pws/observations/current?stationId=${WU_STATION_ID}&format=json&units=m&numericPrecision=decimal&apiKey=${WU_API_KEY}`);
                const data = await res.json();
                const obs = data.observations[0];
                document.getElementById('sl-temp').value = obs.metric.temp;
                document.getElementById('sl-dew').value = obs.metric.dewpt;
                document.getElementById('sl-wind').value = Math.round(obs.metric.windSpeed);
                document.getElementById('sl-dir').value = obs.winddir;
                document.getElementById('sl-rain').value = obs.metric.precipRate;
                recalcPhysics();
            } catch (e) {}
        }

        rebuildTerrainGeometry();
        recalcPhysics();
        syncLiveWeather();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
